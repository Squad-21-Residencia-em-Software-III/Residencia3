
name: CI - Verificacao do Projeto

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - chore/ci-cd-pipeline
      - fix/ci-backend-tests
      - develop
      - main

# Permite apenas leitura do conteúdo do repositório.
permissions:
  contents: read

# Cancela execuções antigas da mesma branch ou PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: |
          node --test ../../scripts/audit-ci.test.cjs
          node ../../scripts/audit-ci.cjs

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar frontend
        run: npm run build

  backend:
    name: Verificar Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: frotas_teste
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d frotas_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: frotas_teste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_SSL: 'false'
      SOLICITACOES_EXTERNAS_SVO_DB_DESCARTAVEL: '1'
      NOTIFICACOES_IN_APP_POSTGRES_TESTS: '1'
      EXPIRACAO_POSTGRES_TESTS: '1'
      NOTIFICACOES_POSTGRES_TESTS: '1'
      EVIDENCIAS_ODOMETRO_POSTGRES_TESTS: '1'
      NOTIFICACOES_SVO_POSTGRES_TESTS: '1'
      FILA_PUSH_POSTGRES_TESTS: '1'
      AVISOS_SOLICITACAO_POSTGRES_TESTS: '1'
      WEB_PUSH_POSTGRES_TESTS: '1'
      REPROGRAMACAO_ADMINISTRATIVA_POSTGRES_TESTS: '1'
      AVISOS_SVO_COLETA_POSTGRES_TESTS: '1'
      AVISOS_SVO_TRIAGEM_POSTGRES_TESTS: '1'
      METRICAS_NOTIFICACOES_POSTGRES_TESTS: '1'

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: |
          node --test ../../scripts/audit-ci.test.cjs
          node ../../scripts/audit-ci.cjs

      - name: Migrar PostgreSQL descartável e validar privilégios de solicitações externas SVO
        env:
          POSTGRES_APP_USER: frotas_app_qa_svo_externo
          POSTGRES_APP_PASSWORD: ci-svo-externo-test-only
        run: |
          npm run db:provisionar-app-user
          npm run migrate
          npm run db:provisionar-app-user
          npm run db:validar-solicitacoes-externas-svo

      - name: Compilar backend
        run: npm run build

      - name: Executar testes automatizados
        run: npm test -- --no-file-parallelism
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production

      # A suíte do endpoint público SVO precisa rodar com a role restrita da aplicação (provada por current_user),
      # que foi provisionada no banco frotas_teste pelo passo de migração acima. As demais suítes seguem como estavam.
      - name: Validar endpoint público SVO em PostgreSQL com a role restrita
        run: npx vitest run src/tests/solicitacaoSvoExternaPostgres.test.ts --no-file-parallelism
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production
          ENDPOINT_PUBLICO_SVO_POSTGRES_TESTS: '1'
          POSTGRES_APP_USER: frotas_app_qa_svo_externo
          POSTGRES_APP_PASSWORD: ci-svo-externo-test-only

      - name: Validar agenda temporal e NO_LOCAL em PostgreSQL
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_DB: fsph_agenda_svo_teste
          POSTGRES_APP_USER: frotas_app_qa_svo_externo
          DB_ROLE: migration
          POSTGRES_SVO_TEST_PORT: '5432'
          AGENDA_SVO_POSTGRES_TESTS: '1'
          CHEGADA_AGENDA_SVO_POSTGRES_TESTS: '1'
          CHEGADA_COLETA_SVO_POSTGRES_TESTS: '1'
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres fsph_agenda_svo_teste
          export POSTGRES_TEST_CONTAINER_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")"
          npm run migrate
          npx vitest run src/tests/agendaSvoPostgres.test.ts src/tests/chegadaColetaSvoPostgres.test.ts --no-file-parallelism

      - name: Verificar tipos TypeScript
        run: npm run typecheck
