
name: CI - Verificacao do Projeto

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - chore/ci-cd-pipeline
      - fix/ci-backend-tests
      - develop
      - main

# Permite apenas leitura do conteúdo do repositório.
permissions:
  contents: read

# Cancela execuções antigas da mesma branch ou PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar frontend
        run: npm run build

  backend:
    name: Verificar Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes automatizados
        run: npm test
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Compilar backend
        run: npm run build
