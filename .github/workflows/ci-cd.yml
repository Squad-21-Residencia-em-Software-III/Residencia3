
name: CI - Verificacao do Projeto

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - chore/ci-cd-pipeline
      - fix/ci-backend-tests
      - develop
      - main

# Permite apenas leitura do conteúdo do repositório.
permissions:
  contents: read

# Cancela execuções antigas da mesma branch ou PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: |
          node --test ../../scripts/audit-ci.test.cjs
          node ../../scripts/audit-ci.cjs

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar frontend
        run: npm run build

  backend:
    name: Verificar Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: frotas_teste
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d frotas_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: frotas_teste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_SSL: 'false'
      SCRUM226_POSTGRES_TESTS: '1'
      EXPIRACAO_POSTGRES_TESTS: '1'
      NOTIFICACOES_POSTGRES_TESTS: '1'
      SCRUM208_POSTGRES_TESTS: '1'
      SCRUM233_POSTGRES_TESTS: '1'
      SCRUM229_POSTGRES_TESTS: '1'
      SCRUM230_POSTGRES_TESTS: '1'
      SCRUM237_POSTGRES_TESTS: '1'
      SCRUM241_POSTGRES_TESTS: '1'

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: |
          node --test ../../scripts/audit-ci.test.cjs
          node ../../scripts/audit-ci.cjs

      - name: Migrar PostgreSQL descartável
        run: npm run migrate

      - name: Compilar backend
        run: npm run build

      - name: Executar testes automatizados
        run: npm test -- --no-file-parallelism
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production

      - name: Validar agenda temporal e NO_LOCAL em PostgreSQL
        env:
          JWT_SECRET: ci-test-only-secret-not-for-production
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_DB: fsph_scrum166_teste
          POSTGRES_SVO_TEST_PORT: '5432'
          SCRUM166_POSTGRES_TESTS: '1'
          SCRUM196_BL31_POSTGRES_TESTS: '1'
          BL31_POSTGRES_TESTS: '1'
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres fsph_scrum166_teste
          export POSTGRES_TEST_CONTAINER_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_CONTAINER")"
          npm run migrate
          npx vitest run src/tests/agendaSvoPostgres.test.ts src/tests/bl31Postgres.test.ts --no-file-parallelism

      - name: Verificar tipos TypeScript
        run: npm run typecheck
