name: Retenção do odômetro

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsph-retencao-odometro
  cancel-in-progress: false

jobs:
  retencao:
    if: >-
      github.repository == 'Squad-21-Residencia-em-Software-III/Residencia3' &&
      github.ref == 'refs/heads/main' &&
      (vars.FSPH_RETENCAO_MODO == 'simular' || vars.FSPH_RETENCAO_MODO == 'aplicar')
    environment:
      name: fsph-retencao-neon
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: src/backend
    env:
      DB_ROLE: app
      POSTGRES_SSL: 'true'
      POSTGRES_POOL_MIN: '0'
      POSTGRES_POOL_MAX: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - name: Preparar comando
        run: npm ci && npm run build
      - name: Processar retenção
        env:
          POSTGRES_HOST: ${{ secrets.FSPH_CRON_PG_HOST }}
          POSTGRES_DB: ${{ secrets.FSPH_CRON_PG_DATABASE }}
          POSTGRES_APP_USER: ${{ secrets.FSPH_CRON_PG_USER }}
          POSTGRES_APP_PASSWORD: ${{ secrets.FSPH_CRON_PG_PASSWORD }}
          MODO_RETENCAO: ${{ vars.FSPH_RETENCAO_MODO }}
          EVIDENCIAS_STORAGE: postgres
          NODE_ENV: production
          TRUST_PROXY: '0'
        run: |
          if [[ -z "$POSTGRES_HOST" || -z "$POSTGRES_DB" || -z "$POSTGRES_APP_USER" || -z "$POSTGRES_APP_PASSWORD" ]]; then
            echo "::error::Configure os segredos de conexão no ambiente protegido deste workflow."
            exit 1
          fi
          export JWT_SECRET="$(node -p 'require("node:crypto").randomBytes(32).toString("hex")')"
          case "$MODO_RETENCAO" in
            simular) npm run evidencias:retencao -- --limite=100 ;;
            aplicar) npm run evidencias:retencao -- --aplicar --limite=100 --lotes=10 ;;
            *) exit 1 ;;
          esac
